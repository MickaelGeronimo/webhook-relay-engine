spring:
  application:
    name: webhook-relay-engine
  datasource:
    url: jdbc:h2:mem:webhook_relay;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: false

server:
  port: 8081

webhook:
  security:
    allow-private-targets: false
    signature-tolerance-seconds: 300
  dispatcher:
    scheduling-enabled: true
    fixed-delay-ms: 5000
    batch-size: 50
    base-retry-delay-seconds: 5
    max-retry-delay-seconds: 300

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

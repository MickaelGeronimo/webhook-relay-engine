services:
  postgres:
    image: postgres:16-alpine
    container_name: webhook-relay-postgres
    environment:
      POSTGRES_DB: webhook_relay
      POSTGRES_USER: relay
      POSTGRES_PASSWORD: relay_secret
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U relay -d webhook_relay"]
      interval: 5s
      timeout: 5s
      retries: 5

  webhook-relay-engine:
    build: .
    container_name: webhook-relay-engine
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      DB_URL: jdbc:postgresql://postgres:5432/webhook_relay
      DB_USERNAME: relay
      DB_PASSWORD: relay_secret
    ports:
      - "8081:8081"
